<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JetSignal - Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="map.css" />
  </head>
  <body>
    <main class="page">
      <div class="sky-background" aria-hidden="true">
        <div class="sky-gradient"></div>
        <div class="cloud-haze"></div>
        <div class="radar-rings"></div>
        <div class="contrails"></div>
      </div>

      <header class="site-header">
        <nav class="site-nav" aria-label="Main">
          <a href="index.html">Home</a>
          <a href="about.html">About Us</a>
          <a href="blog.html">Blog</a>
          <a href="pricing.html">Pricing</a>
          <a href="map.html" class="is-active">Map</a>
        </nav>
      </header>

      <section class="map-shell" aria-labelledby="map-title">
        <div class="map-head">
          <div>
            <p class="eyebrow">Live Airspace</p>
            <h1 id="map-title">Los Angeles Radar</h1>
          </div>
          <div class="status-chip" id="status-chip">Loading</div>
        </div>

        <div class="map-layout">
          <aside class="filters-panel" aria-label="Filters">
            <div class="filter-group">
              <p class="filter-title">Aircraft categories</p>
              <label class="filter-item filter-item-all">
                <input type="checkbox" id="all-categories" checked />
                <span>All categories</span>
              </label>
              <div id="category-list"></div>
            </div>

            <div class="filter-group">
              <p class="filter-title">Aircraft</p>
              <input
                type="text"
                id="aircraft-search"
                class="aircraft-search"
                placeholder="Search callsign or flight"
              />
              <div id="aircraft-list" class="aircraft-list"></div>
            </div>
          </aside>

          <div class="map-stage">
            <div id="aircraft-map" role="application" aria-label="Aircraft map"></div>
            <aside class="map-overlay">
              <p class="overlay-label">Tracked aircraft</p>
              <p class="overlay-count" id="aircraft-count">0</p>
              <p class="overlay-note" id="last-updated">Waiting for first update</p>
            </aside>
          </div>
        </div>
      </section>

      <footer class="footer">JetSignal</footer>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="map.js"></script>
  </body>
</html>
